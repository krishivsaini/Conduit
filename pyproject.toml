[project]
name = "conduit"
version = "0.1.0"
description = "An MCP server that safely exposes a codebase, plus a model-agnostic assistant that discovers its tools at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishiv Saini" }]
keywords = ["mcp", "model-context-protocol", "codebase", "security", "llm"]

# Pinned to the STABLE MCP Python SDK v1.x line. v2 is a pre-release
# ("do not use in production" per the SDK README) — verified live on Day 1.
dependencies = [
    "mcp[cli]>=1.2,<2",
    "pydantic>=2.7",
    "google-genai>=1.0",   # Gemini adapter (host/llm/gemini.py) — Day 9
    "ollama>=0.4",         # local Ollama adapter (host/llm/ollama.py) — Day 10
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
conduit-server = "conduit.server.app:main"   # the MCP server (stdio)
conduit = "conduit.host.cli:main"            # the model-agnostic assistant CLI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conduit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
