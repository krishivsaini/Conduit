# Render blueprint for the live demo API (conduit/web).
#
# The free plan spins down after ~15 minutes idle and takes ~30s to wake, which
# is why the frontend ships its recorded transcripts statically and only needs
# this service for live questions. Deploy the static files separately (any CDN)
# and point them here via CONDUIT_WEB_ORIGINS + <body data-api>.
services:
  - type: web
    name: conduit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CONDUIT_REPO_ROOT
        value: /app/sample-repo
      # auto: Gemini's free tier first, Groq when Gemini is rate limited (only
      # if GROQ_API_KEY is set). Gemini's quota is per model and per day, and
      # this key is shared with local eval runs.
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Render sits behind Cloudflare, which sets this to the one address that
      # connected to it. Do not use X-Forwarded-For: clients can prepend to it.
      - key: CONDUIT_CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Restrict to the static frontend's origin once it is deployed.
      - key: CONDUIT_WEB_ORIGINS
        sync: false
      # Set in the Render dashboard; never committed. Omit it and the demo
      # still serves recorded runs, refusing live ones with a clear message.
      - key: GOOGLE_API_KEY
        sync: false
      # Optional, paid: the fallback. Live runs are capped at 8 a day in total
      # (conduit/web/limits.py), which bounds what it can spend.
      - key: GROQ_API_KEY
        sync: false
